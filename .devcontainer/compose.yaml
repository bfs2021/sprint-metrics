services:
  workspace:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    user: "nobody"
    environment:
      HOME: /tmp
    dns:
      - 127.0.0.11
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "uv", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    user: "postgres"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sprint_metrics
      PGDATA: /pgdata/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /pgdata
      - /var/run/postgresql
